name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ==========================================
      # 3. Setup Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # ==========================================
      # 4. Check Web Files
      # ==========================================
      - name: Check Web Files
        run: |
          echo "=========================================="
          echo "CHECKING WEB FILES"
          echo "=========================================="

          find www -maxdepth 3 -type f | sort

          if [ ! -f "www/index.html" ]; then
            echo "❌ ERROR: www/index.html not found!"
            exit 1
          fi

          echo "✅ www/index.html found!"


      # ==========================================
      # 5. Check App Icon
      # ==========================================
      - name: Check App Icon
        run: |
          echo "=========================================="
          echo "CHECKING APP ICON"
          echo "=========================================="

          if [ ! -f "assets/mknote-icon.png" ]; then
            echo "❌ ERROR: assets/mknote-icon.png not found!"
            exit 1
          fi

          echo "✅ assets/mknote-icon.png found!"
          file assets/mknote-icon.png


      # ==========================================
      # 6. Create package.json
      # ==========================================
      - name: Create package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi


      # ==========================================
      # 7. Install Capacitor
      # ==========================================
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android


      # ==========================================
      # 8. Initialize Capacitor
      # ==========================================
      - name: Initialize Capacitor
        run: |
          npx cap init "MK AP Note" "com.mk.apnote" --web-dir www


      # ==========================================
      # 9. Add Android Platform
      # ==========================================
      - name: Add Android Platform
        run: |
          npx cap add android


      # ==========================================
      # 10. Install Pillow
      # ==========================================
      - name: Install Pillow
        run: |
          python3 -m pip install pillow


      # ==========================================
      # 11. Generate Android App Icons
      # ==========================================
      - name: Generate Android App Icons
        run: |
          python3 - <<'PY'
          from PIL import Image
          import os

          source = "assets/mknote-icon.png"

          print("==========================================")
          print("GENERATING MK NOTE APP ICON")
          print("==========================================")

          if not os.path.exists(source):
              raise FileNotFoundError(
                  "❌ assets/mknote-icon.png not found!"
              )

          img = Image.open(source).convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          base = "android/app/src/main/res"

          for folder, size in sizes.items():

              path = os.path.join(base, folder)
              os.makedirs(path, exist_ok=True)

              resized = img.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              resized.save(
                  os.path.join(path, "ic_launcher.png"),
                  "PNG"
              )

              resized.save(
                  os.path.join(path, "ic_launcher_round.png"),
                  "PNG"
              )

              print(f"✅ {folder} -> {size}x{size}")

          print("==========================================")
          print("✅ APP ICON GENERATED SUCCESSFULLY")
          print("==========================================")
          PY


      # ==========================================
      # 12. Sync Android
      # ==========================================
      - name: Sync Android
        run: |
          npx cap sync android


      # ==========================================
      # 13. Fix Kotlin Duplicate Classes
      # ==========================================
      - name: Fix Kotlin Dependencies
        run: |

          cat >> android/app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == "org.jetbrains.kotlin") {
                      details.useVersion "1.8.22"
                  }
              }

              resolutionStrategy.force(
                  "org.jetbrains.kotlin:kotlin-stdlib:1.8.22",
                  "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22",
                  "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
              )
          }

          EOF


      # ==========================================
      # 14. Clean Gradle
      # ==========================================
      - name: Clean Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean


      # ==========================================
      # 15. Build APK
      # ==========================================
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug


      # ==========================================
      # 16. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MK-AP-Note-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
